AWSTemplateFormatVersion: '2010-09-09'
Description: 'IAM Activity Monitoring - Alerts for CreateUser, CreateAccessKey, and CreateLoginProfile events'

Parameters:
  NotificationEmail:
    Type: String
    Description: Email address to receive IAM activity alerts (leave empty if using Slack only)
    Default: ''

  SlackWebhookUrl:
    Type: String
    Description: >
      Slack webhook URL for notifications (leave empty if using email only).
      NOTE: NoEcho prevents display in the console, but the value is still readable
      via lambda:GetFunctionConfiguration. For higher-security environments, store
      this in SSM Parameter Store (SecureString) or Secrets Manager and retrieve
      it at Lambda runtime instead.
    Default: ''
    NoEcho: true

  ExcludedUserNames:
    Type: CommaDelimitedList
    Description: Comma-separated list of usernames to exclude from alerts (e.g. service accounts)
    Default: ''

  AlertRuleName:
    Type: String
    Description: Name for the EventBridge rule
    Default: 'iam-user-creation-alert'

Conditions:
  UseEmail: !Not [!Equals [!Ref NotificationEmail, '']]
  UseSlack: !Not [!Equals [!Ref SlackWebhookUrl, '']]
  HasNotifications: !Or [!Condition UseEmail, !Condition UseSlack]

Resources:
  # SNS Topic for email notifications
  IAMAlertTopic:
    Type: AWS::SNS::Topic
    Condition: UseEmail
    Properties:
      TopicName: !Sub '${AlertRuleName}-topic'
      DisplayName: IAM Activity Alerts
      Subscription:
        - Endpoint: !Ref NotificationEmail
          Protocol: email

  # SNS Topic Policy
  IAMAlertTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Condition: UseEmail
    Properties:
      Topics:
        - !Ref IAMAlertTopic
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowEventBridgeToPublish
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: 'sns:Publish'
            Resource: !Ref IAMAlertTopic

  # Lambda function for Slack notifications
  SlackNotificationFunction:
    Type: AWS::Lambda::Function
    Condition: UseSlack
    Properties:
      FunctionName: !Sub '${AlertRuleName}-slack-notifier'
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt SlackNotificationFunctionRole.Arn
      Timeout: 30
      Environment:
        Variables:
          SLACK_WEBHOOK_URL: !Ref SlackWebhookUrl
      Code:
        ZipFile: |
          import json
          import logging
          import os
          import urllib3
          from datetime import datetime

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          http = urllib3.PoolManager()

          def lambda_handler(event, context):
              webhook_url = os.environ['SLACK_WEBHOOK_URL']

              # Parse the EventBridge event
              detail = event.get('detail', {})
              event_name = detail.get('eventName', 'Unknown')
              user_name = detail.get('requestParameters', {}).get('userName', 'Unknown')
              event_time = detail.get('eventTime', 'Unknown')
              source_ip = detail.get('sourceIPAddress', 'Unknown')
              user_identity = detail.get('userIdentity', {})
              principal = user_identity.get('principalId', 'Unknown')
              arn = user_identity.get('arn', 'Unknown')
              account_id = event.get('account', 'Unknown')
              region = event.get('region', 'Unknown')

              # Determine color and emoji based on event type
              color_map = {
                  'CreateUser': '#FF9900',
                  'CreateAccessKey': '#FF6600',
                  'CreateLoginProfile': '#FF3300'
              }

              emoji_map = {
                  'CreateUser': ':bust_in_silhouette:',
                  'CreateAccessKey': ':key:',
                  'CreateLoginProfile': ':closed_lock_with_key:'
              }

              color = color_map.get(event_name, '#FF0000')
              emoji = emoji_map.get(event_name, ':warning:')

              # Build Slack message
              slack_message = {
                  'text': f'{emoji} IAM Activity Alert: {event_name}',
                  'attachments': [
                      {
                          'color': color,
                          'title': f'{event_name} Event Detected',
                          'fields': [
                              {
                                  'title': 'Target User',
                                  'value': f'`{user_name}`',
                                  'short': True
                              },
                              {
                                  'title': 'Event Time',
                                  'value': f'`{event_time}`',
                                  'short': True
                              },
                              {
                                  'title': 'Account ID',
                                  'value': f'`{account_id}`',
                                  'short': True
                              },
                              {
                                  'title': 'Region',
                                  'value': f'`{region}`',
                                  'short': True
                              },
                              {
                                  'title': 'Source IP',
                                  'value': f'`{source_ip}`',
                                  'short': True
                              },
                              {
                                  'title': 'Principal',
                                  'value': f'`{principal}`',
                                  'short': True
                              },
                              {
                                  'title': 'Principal ARN',
                                  'value': f'`{arn}`',
                                  'short': False
                              }
                          ],
                          'footer': 'AWS CloudTrail',
                          'ts': int(datetime.now().timestamp())
                      }
                  ]
              }

              # Send to Slack
              try:
                  encoded_data = json.dumps(slack_message).encode('utf-8')
                  response = http.request(
                      'POST',
                      webhook_url,
                      body=encoded_data,
                      headers={'Content-Type': 'application/json'}
                  )
                  if response.status != 200:
                      logger.error(
                          'Slack webhook returned HTTP %s: %s',
                          response.status,
                          response.data.decode('utf-8')
                      )
                      return {
                          'statusCode': response.status,
                          'body': json.dumps(f'Failed to send notification: HTTP {response.status}')
                      }
              except Exception as e:
                  logger.exception('Failed to send Slack notification: %s', str(e))
                  raise

              return {
                  'statusCode': 200,
                  'body': json.dumps('Notification sent to Slack')
              }

  # IAM Role for Lambda
  SlackNotificationFunctionRole:
    Type: AWS::IAM::Role
    Condition: UseSlack
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'

  # Permission for EventBridge to invoke Lambda
  SlackNotificationFunctionPermission:
    Type: AWS::Lambda::Permission
    Condition: UseSlack
    Properties:
      FunctionName: !Ref SlackNotificationFunction
      Action: 'lambda:InvokeFunction'
      Principal: events.amazonaws.com
      SourceArn: !GetAtt IAMEventRule.Arn

  # EventBridge Rule
  IAMEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Ref AlertRuleName
      Description: Alert on IAM user creation and access key/login profile creation
      State: ENABLED
      EventPattern:
        source:
          - aws.iam
        detail-type:
          - AWS API Call via CloudTrail
        detail:
          eventSource:
            - iam.amazonaws.com
          eventName:
            - CreateUser
            - CreateAccessKey
            - CreateLoginProfile
          requestParameters:
            userName:
              - anything-but: !Ref ExcludedUserNames
      Targets:
        - !If
          - UseEmail
          - Arn: !Ref IAMAlertTopic
            Id: email-target
            InputTransformer:
              InputPathsMap:
                eventName: $.detail.eventName
                userName: $.detail.requestParameters.userName
                eventTime: $.detail.eventTime
                sourceIP: $.detail.sourceIPAddress
                principalId: $.detail.userIdentity.principalId
                arn: $.detail.userIdentity.arn
                accountId: $.account
                region: $.region
              InputTemplate: >-
                "IAM Activity Alert\n==================\n\nEvent: <eventName>\nTarget User: <userName>\nTime: <eventTime>\nAccount ID: <accountId>\nRegion: <region>\n\nPerformed by:\nPrincipal: <principalId>\nARN: <arn>\nSource IP: <sourceIP>\n\nThis alert was triggered because a new IAM user, access key, or login profile was created."
          - !Ref AWS::NoValue
        - !If
          - UseSlack
          - Arn: !GetAtt SlackNotificationFunction.Arn
            Id: slack-target
          - !Ref AWS::NoValue

Outputs:
  EventRuleName:
    Description: Name of the EventBridge rule
    Value: !Ref IAMEventRule
    Export:
      Name: !Sub '${AWS::StackName}-RuleName'

  SNSTopicArn:
    Condition: UseEmail
    Description: ARN of the SNS topic for email notifications
    Value: !Ref IAMAlertTopic
    Export:
      Name: !Sub '${AWS::StackName}-TopicArn'

  LambdaFunctionArn:
    Condition: UseSlack
    Description: ARN of the Lambda function for Slack notifications
    Value: !GetAtt SlackNotificationFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-LambdaArn'
